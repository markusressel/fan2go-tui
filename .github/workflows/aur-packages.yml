name: AUR Packages

# Test-builds the Arch packages from packaging/aur:
# - fan2go-tui:     stable package, built from the release tag's source tarball
# - fan2go-tui-git: development package, built from main
# This workflow never publishes: the maintainer publishes with packaging/aur/publish.sh, so the AUR SSH key never has
# to be stored in GitHub (see RELEASING.md).

on:
  push:
    tags:
      - '*.*.*'
  pull_request:
    branches: [ main ]
    paths:
      - 'packaging/aur/**'
      - '.github/workflows/aur-packages.yml'

permissions:
  contents: read

jobs:
  aur:
    name: Build AUR packages
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git pacman-contrib go just

      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Determine version
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            # PR: build the version currently in the stable PKGBUILD
            version="$(sed -n 's/^pkgver=//p' packaging/aur/fan2go-tui/PKGBUILD)"
          fi
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${version}' is not a release version (expected X.Y.Z)"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check the publish script
        run: bash -n packaging/aur/publish.sh

      - name: Prepare build user
        run: |
          useradd --create-home builder
          mkdir -p /build
          cp -r packaging/aur/fan2go-tui packaging/aur/fan2go-tui-git /build/
          cp packaging/aur/fan2go-tui.install /build/fan2go-tui/
          cp packaging/aur/fan2go-tui.install /build/fan2go-tui-git/
          chown -R builder:builder /build

      - name: Build fan2go-tui (stable)
        shell: bash
        working-directory: /build/fan2go-tui
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.meta.outputs.version }}/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          su builder -c "updpkgsums && makepkg --printsrcinfo > .SRCINFO && makepkg --force --noconfirm"
          bash -n fan2go-tui.install
          cat PKGBUILD .SRCINFO

      - name: Build fan2go-tui-git
        shell: bash
        working-directory: /build/fan2go-tui-git
        run: |
          # makepkg updates pkgver in the PKGBUILD from `git describe`
          su builder -c "makepkg --force --noconfirm && makepkg --printsrcinfo > .SRCINFO"
          cat .SRCINFO
